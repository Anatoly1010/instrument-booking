<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Локальный календарь бронирования лабораторных приборов">
  <title>Расписание приборов</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><span>Расписание приборов</span></div>
    <button id="new-booking" class="button primary" type="button" disabled><span aria-hidden="true">+</span> Новая бронь</button>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-labelledby="instruments-heading">
      <h2 id="instruments-heading">Приборы</h2>
      <div id="instruments" class="instruments"></div>
      <button id="new-instrument" class="button add-instrument" type="button"><span aria-hidden="true">+</span> Добавить прибор</button>
      <button id="manage-directory" class="button directory-button" type="button" disabled>Лаборатории и сотрудники</button>
      <button id="manage-resonators" class="button directory-button" type="button" disabled>Резонаторы</button>
    </aside>

    <main>
      <div class="calendar-header">
        <div>
          <div class="calendar-heading">
            <h1 id="calendar-title">Календарь</h1>
            <button id="rename-instrument" class="button rename-instrument" type="button" hidden>Переименовать</button>
          </div>
          <p id="period" class="period"></p>
        </div>
        <div class="view-picker" role="group" aria-label="Вид календаря">
          <button type="button" data-view="day" aria-pressed="false">День</button>
          <button type="button" data-view="week" aria-pressed="true">Неделя</button>
          <button type="button" data-view="month" aria-pressed="false">Месяц</button>
          <button type="button" data-view="rolling" aria-pressed="false">4 недели</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="navigation" role="group" aria-label="Перейти к дате">
          <button id="previous" class="button icon" type="button" aria-label="Предыдущий период">‹</button>
          <button id="today" class="button" type="button">Сегодня</button>
          <button id="next" class="button icon" type="button" aria-label="Следующий период">›</button>
        </div>
        <input id="calendar-date" type="date" aria-label="Выбрать дату">
      </div>

      <p id="status" class="status" role="status" hidden></p>
      <section class="empty" id="empty" hidden>
        <div class="empty-mark" aria-hidden="true">▦</div>
        <h2>Добавьте первый прибор</h2>
        <p>У каждого прибора будет свой календарь для бронирования времени.</p>
        <button id="empty-add" class="button primary" type="button"><span aria-hidden="true">+</span> Добавить прибор</button>
      </section>
      <section id="calendar" class="calendar" aria-label="Сетка календаря" hidden></section>
    </main>
  </div>

  <dialog id="instrument-dialog" aria-labelledby="instrument-dialog-title">
    <form id="instrument-form">
      <div class="dialog-header">
        <h2 id="instrument-dialog-title">Добавить прибор</h2>
        <button class="button icon close" type="button" data-close aria-label="Закрыть">×</button>
      </div>
      <label>Название прибора
        <input name="name" required maxlength="100" placeholder="Например, спектрометр" autofocus>
      </label>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="button" data-close>Отмена</button>
        <button id="save-instrument" type="submit" class="button primary">Добавить</button>
      </div>
    </form>
  </dialog>

  <dialog id="directory-dialog" aria-labelledby="directory-title">
    <div class="dialog-header">
      <h2 id="directory-title">Лаборатории и сотрудники</h2>
      <button class="button icon close" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="directory-content">
      <label>Лаборатория <select id="directory-lab"></select></label>
      <form id="lab-form" class="directory-form">
        <label>Название лаборатории <input name="name" required maxlength="100"></label>
        <button class="button" type="submit">Переименовать</button>
        <p class="form-error" role="alert" hidden></p>
      </form>
      <section class="directory-people" aria-labelledby="directory-people-title">
        <h3 id="directory-people-title">Сотрудники лаборатории</h3>
        <div id="directory-employees" class="directory-employees"></div>
        <form id="employee-form" class="directory-form">
          <label>Имя сотрудника <input name="name" required maxlength="100"></label>
          <button id="save-employee" class="button primary" type="submit">Добавить</button>
          <button id="cancel-employee-edit" class="button wide" type="button" hidden>Отмена редактирования</button>
          <p class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </div>
  </dialog>

  <dialog id="resonator-dialog" aria-labelledby="resonator-title">
    <div class="dialog-header">
      <h2 id="resonator-title">Резонаторы</h2>
      <button class="button icon close" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="directory-content">
      <div id="resonator-list" class="directory-employees"></div>
      <form id="resonator-form" class="directory-form">
        <label>Название резонатора <input name="name" required maxlength="100"></label>
        <button id="save-resonator" class="button primary" type="submit">Добавить</button>
        <button id="cancel-resonator-edit" class="button wide" type="button" hidden>Отмена редактирования</button>
        <p class="form-error" role="alert" hidden></p>
      </form>
    </div>
  </dialog>

  <dialog id="day-bookings-dialog" aria-labelledby="day-bookings-title">
    <div class="dialog-header">
      <h2 id="day-bookings-title"></h2>
      <button class="button icon close" type="button" data-close aria-label="Закрыть">×</button>
    </div>
    <p id="day-bookings-date" class="period"></p>
    <div id="day-bookings-list" class="day-bookings-list"></div>
  </dialog>

  <dialog id="booking-dialog" aria-labelledby="booking-dialog-title">
    <form id="booking-form">
      <div class="dialog-header">
        <h2 id="booking-dialog-title">Новая бронь</h2>
        <button class="button icon close" type="button" data-close aria-label="Закрыть">×</button>
      </div>
      <fieldset>
        <legend>Приборы</legend>
        <div id="booking-instruments" class="choice-list instrument-choices"></div>
      </fieldset>
      <fieldset id="booking-resonator-fields" hidden>
        <legend>Резонаторы</legend>
        <div id="booking-resonators" class="choice-list resonator-choices"></div>
      </fieldset>
      <div class="form-grid">
        <label>Начало <input name="start" type="datetime-local" required></label>
        <label>Окончание <input name="end" type="datetime-local" required></label>
      </div>
      <fieldset>
        <legend>Сотрудники</legend>
        <label>Лаборатория <select id="booking-lab"></select></label>
        <div id="booking-employees" class="choice-list employee-choices"></div>
        <p id="employee-selection" class="selection" aria-live="polite"></p>
      </fieldset>
      <label>Участники вручную <input name="person" maxlength="100" placeholder="Если человека нет в списке"></label>
      <label>Комментарий <textarea name="comment" maxlength="1000" rows="3"></textarea></label>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="cancel-booking" class="button danger" type="button" hidden>Отменить бронь</button>
        <button type="button" class="button" data-close>Закрыть</button>
        <button type="submit" class="button primary">Сохранить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
